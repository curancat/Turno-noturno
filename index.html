<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Templo - Legacy</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700;900&family=Roboto:wght@300;400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script type="module" src="script.js" defer></script>
</head>
<body>
    <audio id="bgm" loop>
        <source src="https://assets.mixkit.co/music/download/mixkit-epic-battle-trailer-238.mp3" type="audio/mpeg">
    </audio>

    <div id="auth-screen" class="screen active">
        <div class="auth-panel">
            <h1 class="logo">Templo</h1>
            <div class="auth-tabs">
                <button id="tab-login" class="active">Iniciar Sessão</button>
                <button id="tab-register">Registrar</button>
            </div>
            
            <form id="login-form" class="auth-form active">
                <div class="input-group">
                    <label for="login-email">E-mail</label>
                    <input type="email" id="login-email" required>
                </div>
                <div class="input-group">
                    <label for="login-password">Senha</label>
                    <input type="password" id="login-password" required>
                </div>
                <button type="submit" class="gold-btn">Entrar</button>
            </form>

            <form id="register-form" class="auth-form">
                <div class="input-group">
                    <label for="reg-email">E-mail</label>
                    <input type="email" id="reg-email" required>
                </div>
                <div class="input-group">
                    <label for="reg-password">Senha</label>
                    <input type="password" id="reg-password" required>
                </div>
                <div class="input-group">
                    <label for="reg-username">Invocador</label>
                    <input type="text" id="reg-username" required>
                </div>
                <button type="submit" class="gold-btn">Forjar Conta</button>
            </form>
            <div id="auth-error"></div>
        </div>
    </div>

    <div id="main-client" class="screen">
        <header class="client-header">
            <h2 class="logo-small">Templo</h2>
            <nav class="main-nav">
                <button class="nav-btn active" data-target="tab-play">Jogar</button>
                <button class="nav-btn" data-target="tab-social">Social</button>
                <button class="nav-btn" data-target="tab-forge">Forja de Builds</button>
                <button class="nav-btn" data-target="tab-collection">Grimório</button>
            </nav>
            <div class="user-controls">
                <span id="player-name-display"></span>
                <span id="player-gold-display">0 Ouro</span>
                <input type="range" id="volume-control" min="0" max="1" step="0.01" value="0.5">
                <button id="logout-btn">Desconectar</button>
            </div>
        </header>

        <main class="client-content">
            <section id="tab-play" class="content-section active">
                <div class="play-setup">
                    <div class="runes-panel">
                        <h3>Runas Ativas</h3>
                        <div class="rune-grid">
                            <div class="rune-card" data-rune="AteAMorte">Até a Morte</div>
                            <div class="rune-card" data-rune="AnjoDourado">Anjo Dourado</div>
                            <div class="rune-card" data-rune="OndasDoMar">Ondas do Mar</div>
                            <div class="rune-card" data-rune="CloneChato">Clone Chato</div>
                            <div class="rune-card" data-rune="Script">Script</div>
                            <div class="rune-card" data-rune="PintorMestre">Pintor Mestre</div>
                        </div>
                    </div>
                    <button id="find-match-btn" class="gold-btn massive">Encontrar Partida</button>
                </div>

                <div id="battlefield" class="hidden">
                    <canvas id="gesture-canvas"></canvas>
                    <div id="combo-display"></div>
                    <div id="turn-indicator">Fase de Compra</div>
                    
                    <div class="board-area">
                        <div class="enemy-zone">
                            <div class="player-avatar" id="enemy-avatar">
                                <div class="hp-bar"><div class="hp-fill" id="enemy-hp"></div></div>
                                <div class="mana-bar"><div class="mana-fill" id="enemy-mana"></div></div>
                            </div>
                            <div class="board-slots" id="enemy-slots"></div>
                        </div>
                        
                        <div class="jungle-zone" id="jungle-area">
                            <div id="jungle-monster"></div>
                        </div>
                        
                        <div class="player-zone">
                            <div class="board-slots" id="player-slots"></div>
                            <div class="player-avatar" id="my-avatar">
                                <div class="hp-bar"><div class="hp-fill" id="my-hp"></div></div>
                                <div class="mana-bar"><div class="mana-fill" id="my-mana"></div></div>
                            </div>
                        </div>
                    </div>
                    
                    <div class="hand-area" id="player-hand"></div>
                    
                    <div class="action-bar">
                        <button id="btn-end-phase" class="gold-btn">Próxima Fase</button>
                        <button id="btn-cast-gesture" class="gold-btn">Conjurar (Q/W/E)</button>
                    </div>
                </div>
            </section>

            <section id="tab-social" class="content-section">
                <div class="social-container">
                    <div class="friends-list">
                        <h3>Lista de Amigos</h3>
                        <div class="add-friend">
                            <input type="text" id="friend-input" placeholder="Invocador ou UID">
                            <button id="add-friend-btn">+</button>
                        </div>
                        <ul id="friends-ul"></ul>
                    </div>
                    <div class="chat-area">
                        <div id="chat-messages"></div>
                        <div class="chat-input-area">
                            <input type="text" id="chat-input" placeholder="Mensagem para o mundo...">
                            <button id="chat-send">Enviar</button>
                        </div>
                    </div>
                </div>
            </section>

            <section id="tab-forge" class="content-section">
                <div class="forge-container">
                    <div class="forge-controls">
                        <h3>Calculadora de Atributos</h3>
                        <div class="stat-inputs">
                            <div class="stat-in"><label>AP</label><input type="number" id="target-ap" value="0"></div>
                            <div class="stat-in"><label>AD</label><input type="number" id="target-ad" value="0"></div>
                            <div class="stat-in"><label>RM</label><input type="number" id="target-rm" value="0"></div>
                            <div class="stat-in"><label>RF</label><input type="number" id="target-rf" value="0"></div>
                            <div class="stat-in"><label>VM</label><input type="number" id="target-vm" value="0"></div>
                            <div class="stat-in"><label>MM</label><input type="number" id="target-mm" value="0"></div>
                            <div class="stat-in"><label>VA</label><input type="number" id="target-va" value="0"></div>
                            <div class="stat-in"><label>VP</label><input type="number" id="target-vp" value="0"></div>
                        </div>
                        <button id="calculate-build" class="gold-btn">Gerar Build Ideal</button>
                    </div>
                    <div class="forge-results" id="build-results"></div>
                </div>
            </section>

            <section id="tab-collection" class="content-section">
                <div class="shop-header">
                    <input type="text" id="shop-search" placeholder="Buscar artefatos...">
                    <select id="shop-sort">
                        <option value="cost-asc">Custo: Menor</option>
                        <option value="cost-desc">Custo: Maior</option>
                        <option value="name-asc">Nome: A-Z</option>
                    </select>
                </div>
                <div class="shop-grid" id="shop-grid"></div>
            </section>
        </main>
    </div>
</body>
</html>
