<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Templo</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700;900&family=Roboto:wght@300;400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <audio id="bgm" loop preload="auto">
        <source src="https://cdn.pixabay.com/audio/2022/01/18/audio_d0a13f69d2.mp3" type="audio/mpeg">
    </audio>

    <div id="auth-container">
        <div class="auth-box">
            <div class="auth-logo">TEMPLO</div>
            <form id="login-form">
                <input type="email" id="login-email" placeholder="E-mail" required>
                <input type="password" id="login-password" placeholder="Senha" required>
                <button type="submit" class="btn-gold">Entrar no Templo</button>
            </form>
            <form id="register-form" style="display: none;">
                <input type="text" id="register-name" placeholder="Nome de Invocador" required>
                <input type="email" id="register-email" placeholder="E-mail" required>
                <input type="password" id="register-password" placeholder="Senha" required>
                <button type="submit" class="btn-gold">Forjar Conta</button>
            </form>
            <div class="auth-toggle" id="auth-toggle">Criar nova conta</div>
        </div>
    </div>

    <div id="app-container" style="display: none;">
        <nav id="top-nav">
            <div class="nav-brand">TEMPLO</div>
            <div class="nav-tabs">
                <button class="tab-btn active" data-target="tab-play">Jogar</button>
                <button class="tab-btn" data-target="tab-social">Social</button>
                <button class="tab-btn" data-target="tab-forge">Forja</button>
            </div>
            <div class="nav-user">
                <span id="player-name-display"></span>
                <button id="btn-logout" class="btn-small">Sair</button>
                <input type="range" id="vol-control" min="0" max="1" step="0.01" value="0.5">
            </div>
        </nav>

        <main id="main-content">
            <section id="tab-play" class="tab-content active">
                <div class="matchmaking-panel" id="matchmaking-panel">
                    <h2>Preparação para Batalha</h2>
                    <div class="runes-selection">
                        <div class="rune-card" data-rune="morte">Até a Morte</div>
                        <div class="rune-card" data-rune="anjo">Anjo Dourado</div>
                        <div class="rune-card" data-rune="ondas">Ondas do Mar</div>
                        <div class="rune-card" data-rune="clone">Clone Chato</div>
                        <div class="rune-card" data-rune="script">Script</div>
                        <div class="rune-card" data-rune="pintor">Pintor Mestre</div>
                    </div>
                    <button id="btn-find-match" class="btn-gold large">Encontrar Partida</button>
                    <div id="match-status"></div>
                </div>

                <div class="game-board" id="game-board" style="display: none;">
                    <canvas id="spell-canvas"></canvas>
                    
                    <div class="jungle-area" id="jungle-area">
                        <div class="monster-card" id="current-monster">
                            <h3 id="monster-name">Fantasma</h3>
                            <div class="monster-stats">
                                HP: <span id="monster-hp">1000</span> | ATK: <span id="monster-atk">50</span>
                            </div>
                        </div>
                    </div>

                    <div class="enemy-area" id="enemy-area">
                        <div class="player-avatar enemy">
                            <div class="hp-bar"><div class="hp-fill" id="enemy-hp-fill"></div></div>
                            <span id="enemy-name">Inimigo</span>
                            <span id="enemy-hp-text">4000/4000</span>
                        </div>
                        <div class="board-slots enemy-slots" id="enemy-board"></div>
                    </div>

                    <div class="player-area" id="player-area">
                        <div class="board-slots player-slots" id="player-board"></div>
                        <div class="player-avatar player">
                            <div class="hp-bar"><div class="hp-fill" id="player-hp-fill"></div></div>
                            <span id="player-in-game-name">Você</span>
                            <span id="player-hp-text">4000/4000</span>
                        </div>
                        <div class="mana-container">
                            Mana: <span id="player-mana">0</span> / <span id="player-max-mana">0</span>
                        </div>
                        <div class="hand-container" id="player-hand"></div>
                    </div>

                    <div class="turn-indicator" id="turn-indicator">Fase de Compra</div>
                    <button id="btn-end-phase" class="btn-gold">Avançar Fase</button>
                    <div class="combo-display" id="combo-display"></div>
                </div>
            </section>

            <section id="tab-social" class="tab-content">
                <div class="social-layout">
                    <div class="friends-list">
                        <h3>Lista de Amigos</h3>
                        <div class="add-friend">
                            <input type="text" id="friend-input" placeholder="UID ou Nome">
                            <button id="btn-add-friend" class="btn-small">Adicionar</button>
                        </div>
                        <ul id="friends-ul"></ul>
                    </div>
                    <div class="chat-container">
                        <div class="chat-messages" id="chat-messages"></div>
                        <div class="chat-input-area">
                            <input type="text" id="chat-input" placeholder="Enviar mensagem para o servidor...">
                            <button id="btn-send-chat" class="btn-gold">Enviar</button>
                        </div>
                    </div>
                </div>
            </section>

            <section id="tab-forge" class="tab-content">
                <div class="forge-layout">
                    <div class="forge-calculator">
                        <h3>Calculadora de Atributos</h3>
                        <div class="stat-inputs">
                            <label>AP: <input type="number" id="t-ap" value="0"></label>
                            <label>AD: <input type="number" id="t-ad" value="0"></label>
                            <label>RM: <input type="number" id="t-rm" value="0"></label>
                            <label>RF: <input type="number" id="t-rf" value="0"></label>
                            <label>VM: <input type="number" id="t-vm" value="0"></label>
                            <label>MM: <input type="number" id="t-mm" value="0"></label>
                            <label>VA: <input type="number" id="t-va" value="0"></label>
                            <label>VP: <input type="number" id="t-vp" value="0"></label>
                        </div>
                        <button id="btn-calc-build" class="btn-gold">Calcular Build Ideal</button>
                        <div id="build-result"></div>
                    </div>
                    <div class="forge-shop">
                        <div class="shop-controls">
                            <input type="text" id="shop-search" placeholder="Buscar itens...">
                            <select id="shop-sort">
                                <option value="price">Preço</option>
                                <option value="name">Nome</option>
                                <option value="ap">AP</option>
                                <option value="ad">AD</option>
                            </select>
                        </div>
                        <div class="shop-grid" id="shop-grid"></div>
                    </div>
                </div>
            </section>
        </main>
    </div>
    <script type="module" src="script.js"></script>
</body>
</html>
