<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cartas Contra a Humanidade</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="notificacao" class="escondido">
        <span id="texto-notificacao"></span>
    </div>

    <div id="tela-login" class="tela ativa">
        <div class="caixa-centralizada">
            <h1>Cartas Contra a Humanidade</h1>
            <p>Digite seu apelido para conectar</p>
            <input type="text" id="input-nome" placeholder="Apelido">
            <button onclick="entrarNoJogo()">Conectar</button>
        </div>
    </div>

    <div id="tela-lobby" class="tela">
        <div class="caixa-centralizada">
            <h1>Lobby da Sala</h1>
            <div class="box-jogadores">
                <h3>Jogadores Conectados</h3>
                <ul id="lista-jogadores"></ul>
            </div>
            <button onclick="iniciarPartida()" id="btn-iniciar" class="escondido">Iniciar Partida</button>
            <p id="msg-aguardando">Aguardando o anfitrião iniciar...</p>
        </div>
    </div>

    <div id="tela-jogo" class="tela">
        <header>
            <div class="status-bloco">
                <span class="icone">🏆</span>
                <span>Pontos: <span id="meus-pontos">0</span></span>
            </div>
            <div class="status-bloco central">
                <span id="texto-fase">Aguardando</span>
                <span id="cronometro">00:00</span>
            </div>
            <button onclick="abrirLoja()">Acessar Loja</button>
        </header>

        <main>
            <section class="mesa">
                <div id="alertas-efeitos"></div>
                <div class="carta carta-preta" id="carta-frase-atual">
                    Carregando...
                </div>
                <!-- Adicione este botão logo abaixo da caixa de pergunta no seu HTML (#jogo-tela) -->
            <button onclick="trocarCartaPreta()" style="background-color: #555; margin-top: 10px;">Trocar Carta</button>
            </section>
        
            <section id="area-votacao" class="escondido">
                <h2>Selecione a carta mais absurda</h2>
                <div id="cartas-jogadas" class="flex-container"></div>
            </section>

            <section class="mao-jogador" id="area-mao">
                <div class="header-mao">
                    <h2>Suas Cartas</h2>
                    <input type="text" id="filtro-cartas" placeholder="Pesquisar carta" onkeyup="filtrarCartas()">
                </div>
                <div id="minhas-cartas" class="flex-container"></div>
            </section>
        </main>
    </div>

    <div id="modal-loja" class="modal-overlay escondido">
        <div class="conteudo-modal">
            <h2>Loja de Itens</h2>
            <button onclick="fecharLoja()" class="btn-fechar">Voltar</button>
            <div id="lista-itens" class="grid-itens"></div>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
    <script src="script.js"></script>
</body>
</html>
